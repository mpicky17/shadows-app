<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Excalibur — Quest Lost</title>
<!--
  STANDALONE comic-book animation (BLACK & WHITE): Excalibur lost (Quest LOST).
  The sword's tip is embedded in a stone; a swamp surrounds the stone, and the
  stone (with the sword) sinks down into the swamp.
  Pure CSS + inline SVG, no dependencies. Auto-plays on load; "Replay" restarts it.

  To embed in the game later: lift the .panel markup + this <style> (scoped under
  .panel) into an overlay element, show it when the Excalibur quest is LOST, then call
  panel.classList.add('play') to trigger. Remove the overlay when the existing
  questResult overlay is dismissed.
-->
<style>
  :root {
    --ink: #0c0c0c; --steel: #cfcfcf; --steel-hi: #ffffff; --steel-sh: #8f8f8f;
    --metal: #b8b8b8; --grip: #4a4a4a; --stone1: #4f4f4f; --stone2: #636363; --stone-dk: #232323;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem;
    -webkit-user-select: none; user-select: none;
  }

  /* ── Comic panel ─────────────────────────────────────────── */
  .panel {
    position: relative;
    width: min(92vw, 420px);
    height: min(115vw, 520px);
    border: 6px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,0.6), 0 18px 40px rgba(0,0,0,0.85);
    transform: rotate(0.6deg);
    background: #0e0e0e;
  }
  .layer { position: absolute; inset: 0; }

  /* Grayscale murky background */
  .bg { background: radial-gradient(120% 80% at 50% 28%, #4a4a4a 0%, #232323 48%, #060606 100%); }

  /* Stone + embedded sword, sink together as one group */
  .sink-group {
    position: absolute;
    left: 50%; bottom: 10%;
    width: min(74vw, 250px); height: auto;
    z-index: 2;
    transform: translateX(-50%) translateY(0) rotate(0deg);
  }
  .panel.play .sink-group { animation: sinkGroup 4.2s cubic-bezier(.5,0,.75,.6) both; }
  @keyframes sinkGroup {
    0%   { transform: translateX(-50%) translateY(-4px) rotate(0deg); }
    14%  { transform: translateX(-50%) translateY(-9px) rotate(-1.2deg); }
    30%  { transform: translateX(-50%) translateY(6px)  rotate(1.4deg); }
    100% { transform: translateX(-50%) translateY(285px) rotate(2.5deg); opacity: 0.85; }
  }

  /* Swamp water — sits ABOVE the group so submerged parts read as underwater */
  .swamp {
    top: 60%; bottom: 0; left: 0; right: 0; z-index: 4;
    background: linear-gradient(to bottom, rgba(55,55,55,0.55) 0%, rgba(24,24,24,0.8) 45%, rgba(6,6,6,0.94) 100%);
    -webkit-backdrop-filter: blur(1.8px); backdrop-filter: blur(1.8px);
    border-top: 2px solid rgba(200,200,200,0.6);
    overflow: hidden;
  }
  .swamp::after {
    content: ''; position: absolute; inset: -20% -20% 0 -20%;
    background: repeating-linear-gradient(100deg,
      rgba(200,200,200,0.0) 0px, rgba(200,200,200,0.09) 22px, rgba(200,200,200,0.0) 44px);
    animation: shimmer 7s linear infinite;
  }
  @keyframes shimmer { to { transform: translateX(44px); } }

  /* Reeds along the swamp surface (in front of the stone) */
  .reeds { top: 0; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none; }

  /* Surface ripple rings + bubbles (created in JS) */
  .fx { z-index: 6; pointer-events: none; }
  .ring {
    position: absolute; left: 50%; top: 60%;
    width: 30px; height: 12px; margin: -6px 0 0 -15px;
    border: 2px solid rgba(210,210,210,0.8); border-radius: 50%;
    opacity: 0; animation: ripple 2.0s ease-out both;
  }
  @keyframes ripple {
    0% { opacity: 0; transform: scale(0.3); }
    20% { opacity: 0.85; }
    100% { opacity: 0; transform: scale(7); }
  }
  .bubble {
    position: absolute;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95), rgba(150,150,150,0.45) 70%, transparent);
    border-radius: 50%; opacity: 0; animation: rise 2.4s ease-in both;
  }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(20px) scale(0.6); }
    25% { opacity: 0.85; }
    100% { opacity: 0; transform: translateY(-80px) scale(1); }
  }

  /* Halftone comic shading */
  .halftone {
    background-image: radial-gradient(circle, rgba(0,0,0,0.45) 1px, transparent 1.6px);
    background-size: 6px 6px; mix-blend-mode: multiply; opacity: 0.22; z-index: 7;
  }

  /* Cold vignette darkens as the blade is lost */
  .darken {
    background: radial-gradient(circle at 50% 58%, transparent 28%, rgba(2,2,2,0.9) 100%);
    opacity: 0; z-index: 8;
  }
  .panel.play .darken { animation: darken 4.2s ease-in both; }
  @keyframes darken { 0%, 58% { opacity: 0; } 100% { opacity: 0.92; } }

  .replay {
    font-family: inherit; font-size: 1rem; cursor: pointer;
    background: transparent; color: #fff; border: 2px solid #fff; border-radius: 8px;
    padding: 0.5rem 1.5rem; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .replay:hover, .replay:focus { background: #fff; color: #000; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="layer bg"></div>

    <!-- Stone with the sword's tip embedded, drawn as one sinking group -->
    <svg class="sink-group" viewBox="0 0 250 360" fill="none">
      <!-- sword, point-down, hilt up -->
      <circle cx="125" cy="22" r="10" fill="var(--metal)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle cx="125" cy="22" r="3.5" fill="var(--steel-hi)"/>
      <rect x="117" y="32" width="16" height="48" rx="4" fill="var(--grip)" stroke="var(--ink)" stroke-width="2.5"/>
      <line x1="118" y1="42" x2="132" y2="46" stroke="#8a8a8a" stroke-width="1.5"/>
      <line x1="118" y1="54" x2="132" y2="58" stroke="#8a8a8a" stroke-width="1.5"/>
      <line x1="118" y1="66" x2="132" y2="70" stroke="#8a8a8a" stroke-width="1.5"/>
      <rect x="96" y="80" width="58" height="15" rx="5" fill="var(--metal)" stroke="var(--ink)" stroke-width="2.5"/>
      <circle cx="110" cy="87" r="4" fill="var(--stone-dk)" stroke="var(--ink)" stroke-width="1.5"/>
      <circle cx="140" cy="87" r="4" fill="var(--steel-hi)" stroke="var(--ink)" stroke-width="1.5"/>
      <!-- blade points down into the stone -->
      <path d="M108 95 L142 95 L142 150 L125 192 L108 150 Z" fill="var(--steel)" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M125 95 L134 150 L125 178 Z" fill="var(--steel-hi)" opacity="0.55"/>

      <!-- stone with the blade tip embedded in its top -->
      <path d="M38 332 L58 182 Q66 164 100 160 L150 160 Q184 164 192 182 L212 332 Z"
            fill="var(--stone1)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
      <path d="M58 182 Q66 164 100 160 L150 160 Q184 164 192 182 L188 196 L62 196 Z" fill="var(--stone2)"/>
      <rect x="114" y="158" width="22" height="14" rx="3" fill="#121212" stroke="var(--ink)" stroke-width="3"/>
      <path d="M70 270 L96 262 M158 276 L196 266 M104 306 L132 300" stroke="var(--stone-dk)" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <div class="layer swamp"></div>

    <svg class="layer reeds" viewBox="0 0 420 520" preserveAspectRatio="none" fill="none">
      <g stroke="#161616" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
        <path d="M44 520 Q40 380 30 320"/>
        <path d="M70 520 Q74 400 86 344"/>
        <path d="M360 520 Q366 384 384 322"/>
        <path d="M392 520 Q388 410 378 350"/>
      </g>
      <g fill="#161616" opacity="0.9">
        <ellipse cx="29" cy="316" rx="5" ry="14"/>
        <ellipse cx="87" cy="340" rx="5" ry="14"/>
        <ellipse cx="385" cy="318" rx="5" ry="14"/>
        <ellipse cx="377" cy="346" rx="5" ry="14"/>
      </g>
    </svg>

    <div class="layer fx" id="fx"></div>
    <div class="layer halftone"></div>
    <div class="layer darken"></div>
  </div>

  <button class="replay" id="replay">Replay</button>

<script>
  const panel = document.getElementById('panel');
  const fx = document.getElementById('fx');

  function buildFx() {
    fx.innerHTML = '';
    // ripple rings as the stone settles into and sinks beneath the swamp
    const ringDelays = [0.9, 1.6, 2.3, 3.0];
    for (const d of ringDelays) {
      const r = document.createElement('div');
      r.className = 'ring';
      r.style.animationDelay = d.toFixed(2) + 's';
      fx.appendChild(r);
    }
    // bubbles rising around the stone throughout the sink
    const n = 12;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 4 + Math.random() * 9;
      b.style.width = b.style.height = size + 'px';
      b.style.left = (50 + (Math.random() * 34 - 17)) + '%';
      b.style.top = (61 + Math.random() * 12) + '%';
      b.style.animationDelay = (1.0 + Math.random() * 2.2).toFixed(2) + 's';
      fx.appendChild(b);
    }
  }

  function play() {
    panel.classList.remove('play');
    void panel.offsetWidth;
    buildFx();
    panel.classList.add('play');
  }

  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('load', play);
</script>
</body>
</html>
