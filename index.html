<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#2D1B4E">
  <title>Shadows Over Camelot</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Firebase SDK (compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <style>
    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1A1A2E;
      color: #F5F0E1;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Theme Variables ────────────────────────────────────────────────── */
    :root {
      --bg-dark: #1A1A2E;
      --bg-card: #16213E;
      --bg-surface: #0F3460;
      --gold: #D4A843;
      --gold-dim: #8B7230;
      --red: #8B1A1A;
      --red-bright: #C62828;
      --purple: #2D1B4E;
      --purple-light: #4A148C;
      --parchment: #F5F0E1;
      --text: #F5F0E1;
      --text-dim: #9E9E9E;
      --green: #2E7D32;
      --blue: #1565C0;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* ── Typography ─────────────────────────────────────────────────────── */
    h1 { font-size: 1.75rem; font-weight: 700; color: var(--gold); text-align: center; }
    h2 { font-size: 1.25rem; font-weight: 600; color: var(--gold); }
    h3 { font-size: 1.1rem; font-weight: 600; }

    /* ── Shared Components ──────────────────────────────────────────────── */
    .screen { display: none; flex-direction: column; min-height: 100dvh; padding: 1rem; }
    .screen.active { display: flex; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.75rem 1.5rem;
      font-size: 1rem; font-weight: 600;
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: all 0.2s;
      min-height: 48px;
    }
    .btn:hover, .btn:focus { background: var(--gold); color: var(--bg-dark); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:disabled:hover { background: transparent; color: var(--gold); }
    .btn-primary { background: var(--gold); color: var(--bg-dark); }
    .btn-primary:hover { background: #E8C252; }
    .btn-danger { border-color: var(--red-bright); color: var(--red-bright); }
    .btn-danger:hover { background: var(--red-bright); color: white; }

    .input {
      padding: 0.75rem 1rem;
      font-size: 1rem;
      background: var(--bg-card);
      color: var(--text);
      border: 2px solid var(--gold-dim);
      border-radius: var(--radius);
      outline: none;
      min-height: 48px;
    }
    .input:focus { border-color: var(--gold); }
    .input::placeholder { color: var(--text-dim); }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(212,168,67,0.2);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    /* ── Connection Status ──────────────────────────────────────────────── */
    #connection-status {
      position: fixed; top: 0; left: 0; right: 0;
      text-align: center; font-size: 0.875rem; padding: 0.25rem;
      z-index: 1000; transition: opacity 0.3s;
    }
    #connection-status.connected { background: var(--green); opacity: 0; pointer-events: none; }
    #connection-status.disconnected { background: var(--red-bright); opacity: 1; }
    #connection-status.connecting { background: var(--gold-dim); opacity: 1; }

    /* ── Home Screen ────────────────────────────────────────────────────── */
    #home-screen {
      align-items: center;
      justify-content: center;
      gap: 2rem;
      text-align: center;
    }
    .home-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      line-height: 1.2;
    }
    .home-subtitle {
      font-size: 1rem;
      color: var(--text-dim);
      max-width: 320px;
    }
    .home-actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }
    .home-join-row {
      display: flex;
      gap: 0.5rem;
    }
    .home-join-row .input {
      flex: 1;
      text-transform: uppercase;
      text-align: center;
      font-size: 1.25rem;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
    .home-shield {
      width: 120px; height: 120px;
      margin: 0 auto;
    }
    .version-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      position: fixed;
      bottom: 0.5rem;
      right: 0.75rem;
    }

    /* ── Name Entry Screen ──────────────────────────────────────────────── */
    #name-screen {
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    .name-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }

    /* ── Lobby Screen ───────────────────────────────────────────────────── */
    #lobby-screen {
      gap: 1.5rem;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .lobby-header {
      text-align: center;
    }
    .room-code-display {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-align: center;
      background: var(--bg-card);
      border: 2px solid var(--gold);
      border-radius: var(--radius);
      padding: 0.75rem 1.5rem;
      cursor: pointer;
      user-select: all;
      transition: background 0.2s;
    }
    .room-code-display:active { background: var(--gold-dim); }
    .room-code-hint {
      font-size: 0.875rem;
      color: var(--text-dim);
      text-align: center;
      margin-top: 0.25rem;
    }
    .knight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .knight-card {
      display: flex; flex-direction: column;
      align-items: center;
      padding: 0.75rem;
      border: 2px solid transparent;
      border-radius: var(--radius);
      background: var(--bg-card);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: 120px;
      justify-content: center;
    }
    .knight-card:hover { border-color: var(--gold-dim); }
    .knight-card.selected { border-color: var(--gold); background: rgba(212,168,67,0.1); }
    .knight-card.taken { opacity: 0.4; cursor: not-allowed; pointer-events: none; }
    .knight-card img { width: 48px; height: 48px; margin-bottom: 0.5rem; }
    .knight-card .knight-name { font-size: 1rem; font-weight: 600; color: var(--text); }
    .knight-card .knight-title { font-size: 0.75rem; color: var(--text-dim); margin-top: 0.125rem; }
    .knight-card .knight-taken-by {
      font-size: 0.75rem; color: var(--gold);
      margin-top: 0.25rem; font-style: italic;
    }

    .lobby-players {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .player-row {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      background: var(--bg-card);
      border-radius: var(--radius);
    }
    .player-row img { width: 32px; height: 32px; }
    .player-row .player-name { flex: 1; font-weight: 600; }
    .player-row .player-badge {
      font-size: 0.75rem; padding: 0.125rem 0.5rem;
      border-radius: 4px; background: var(--gold-dim); color: var(--bg-dark);
    }

    .lobby-settings {
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.75rem;
      background: var(--bg-card);
      border-radius: var(--radius);
    }
    .setting-row label { font-size: 1rem; }

    /* Toggle switch */
    .toggle {
      position: relative; width: 48px; height: 28px;
      background: #444; border-radius: 14px;
      cursor: pointer; transition: background 0.2s;
    }
    .toggle.on { background: var(--green); }
    .toggle::after {
      content: ''; position: absolute;
      top: 2px; left: 2px; width: 24px; height: 24px;
      background: white; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.on::after { transform: translateX(20px); }

    .lobby-actions {
      display: flex; flex-direction: column; gap: 0.75rem;
      margin-top: auto;
      padding-bottom: 2rem;
    }

    /* ── Game Screen (placeholder for Phase 2+) ──────────────────────────── */
    #game-screen {
      align-items: center;
      justify-content: center;
      gap: 1rem;
      text-align: center;
    }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (min-width: 768px) {
      .knight-grid { grid-template-columns: repeat(4, 1fr); }
      .home-title { font-size: 2.5rem; }
    }

    /* ── Toast Notification ─────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
      background: var(--bg-surface); color: var(--text);
      padding: 0.75rem 1.5rem; border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--gold-dim);
      font-size: 0.875rem; z-index: 999;
      opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

  <!-- Connection Status Banner -->
  <div id="connection-status" class="connecting">Connecting...</div>

  <!-- ── Home Screen ─────────────────────────────────────────────────── -->
  <div id="home-screen" class="screen active">
    <img src="assets/knight-arthur.svg" alt="Shield" class="home-shield">
    <h1 class="home-title">Shadows Over<br>Camelot</h1>
    <p class="home-subtitle">A cooperative board game of Knights, Quests, and hidden treachery. 3–7 players.</p>
    <div class="home-actions">
      <button class="btn btn-primary" id="btn-create">Create Game</button>
      <div class="home-join-row">
        <input class="input" id="join-code" type="text" placeholder="ROOM CODE" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="btn-join">Join</button>
      </div>
    </div>
  </div>

  <!-- ── Name Entry Screen ───────────────────────────────────────────── -->
  <div id="name-screen" class="screen">
    <h2>Enter Your Name</h2>
    <div class="name-form">
      <input class="input" id="player-name" type="text" placeholder="Your name" maxlength="20" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="btn-confirm-name">Continue</button>
      <button class="btn" id="btn-back-home">Back</button>
    </div>
  </div>

  <!-- ── Lobby Screen ────────────────────────────────────────────────── -->
  <div id="lobby-screen" class="screen">
    <div class="lobby-header">
      <h2>Game Lobby</h2>
    </div>
    <div class="room-code-display" id="lobby-code" title="Tap to copy"></div>
    <p class="room-code-hint">Share this code with other players</p>

    <h3>Choose Your Knight</h3>
    <div class="knight-grid" id="knight-grid"></div>

    <h3>Players (<span id="player-count">0</span>/7)</h3>
    <div class="lobby-players" id="player-list"></div>

    <div class="lobby-settings" id="host-settings" style="display:none;">
      <h3>Game Settings</h3>
      <div class="setting-row">
        <label>Include Traitor Card</label>
        <div class="toggle on" id="toggle-traitor" role="button" tabindex="0"></div>
      </div>
    </div>

    <div class="lobby-actions">
      <button class="btn btn-primary" id="btn-start" style="display:none;" disabled>Start Game (need 3+ players)</button>
      <button class="btn btn-danger" id="btn-leave">Leave Game</button>
    </div>
  </div>

  <!-- ── Game Screen (Phase 2+) ──────────────────────────────────────── -->
  <div id="game-screen" class="screen">
    <h2>Game Starting...</h2>
    <p>The quest begins! (Game board coming in Phase 2)</p>
    <div id="game-players-info"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Version -->
  <div class="version-label" id="app-version"></div>

  <script>
    'use strict';
    const APP_VERSION = 'shadows-v1';
    document.getElementById('app-version').textContent = APP_VERSION;

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 1: Constants & Knight Definitions
    // ═══════════════════════════════════════════════════════════════════

    const KNIGHTS = {
      arthur:    { name: 'King Arthur',    title: 'Son of Uther Pendragon', color: '#8B1A1A', icon: 'assets/knight-arthur.svg' },
      galahad:   { name: 'Sir Galahad',    title: 'Son of Lancelot',        color: '#1E3A5F', icon: 'assets/knight-galahad.svg' },
      gawain:    { name: 'Sir Gawain',     title: 'Son of King Lot',        color: '#1B5E20', icon: 'assets/knight-gawain.svg' },
      kay:       { name: 'Sir Kay',        title: 'Seneschal of King Arthur',color: '#1565C0', icon: 'assets/knight-kay.svg' },
      palamedes: { name: 'Sir Palamedes',  title: 'Saracen Knight',         color: '#2D1B4E', icon: 'assets/knight-palamedes.svg' },
      percival:  { name: 'Sir Percival',   title: 'Son of Pellinore',       color: '#616161', icon: 'assets/knight-percival.svg' },
      tristan:   { name: 'Sir Tristan',    title: 'of Lyonesse',            color: '#4A148C', icon: 'assets/knight-tristan.svg' },
    };

    const ROOM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no I/O/0/1 to avoid confusion

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 2: App State
    // ═══════════════════════════════════════════════════════════════════

    let myUid = null;           // Firebase anonymous UID
    let myName = '';            // player display name
    let myKnight = null;        // selected knight ID
    let currentRoom = null;     // room code
    let isHost = false;         // am I the host?
    let gameListener = null;    // Firebase listener handle
    let playersListener = null;
    let roomData = null;        // cached room meta

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 3: Firebase Setup
    // ═══════════════════════════════════════════════════════════════════

    // SETUP (one-time):
    // 1. Go to console.firebase.google.com → create NEW project (separate from my-checklist-app)
    // 2. Add a Web App → copy the 5 config values below
    // 3. Enable Authentication → Sign-in method → Anonymous
    // 4. Enable Realtime Database → paste security rules from CLAUDE.md
    // 5. If hosting on GitHub Pages, add domain to Authorized domains
    const FIREBASE_CONFIG = {
      apiKey:      'AIzaSyD3lp83aKbe7V-eE6zNMRQosIt688BlYPc',
      authDomain:  'shadows-over-camelot-2abcb.firebaseapp.com',
      databaseURL: 'https://shadows-over-camelot-2abcb-default-rtdb.firebaseio.com',
      projectId:   'shadows-over-camelot-2abcb',
      appId:       '1:762272780817:web:23059889d0facbac7cd7b0'
    };

    const FIREBASE_ENABLED = FIREBASE_CONFIG.apiKey !== 'REPLACE_WITH_YOUR_API_KEY';

    let fbAuth, fbDb;

    if (FIREBASE_ENABLED) {
      firebase.initializeApp(FIREBASE_CONFIG);
      fbAuth = firebase.auth();
      fbDb   = firebase.database();
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 4: Utility Functions
    // ═══════════════════════════════════════════════════════════════════

    function $(id) { return document.getElementById(id); }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
    }

    function showToast(msg, duration = 3000) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), duration);
    }

    function generateRoomCode() {
      let code = '';
      for (let i = 0; i < 6; i++) {
        code += ROOM_CODE_CHARS[Math.floor(Math.random() * ROOM_CODE_CHARS.length)];
      }
      return code;
    }

    function setConnectionStatus(state) {
      const el = $('connection-status');
      el.className = state;
      el.textContent = state === 'connected' ? 'Connected' :
                       state === 'disconnected' ? 'Disconnected — reconnecting...' :
                       'Connecting...';
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 5: Authentication
    // ═══════════════════════════════════════════════════════════════════

    async function initAuth() {
      if (!FIREBASE_ENABLED) {
        setConnectionStatus('disconnected');
        showToast('Firebase not configured. See CLAUDE.md for setup instructions.');
        return;
      }

      setConnectionStatus('connecting');

      try {
        const cred = await fbAuth.signInAnonymously();
        myUid = cred.user.uid;

        // Restore saved name
        const savedName = localStorage.getItem('shadows-player-name');
        if (savedName) myName = savedName;

        // Monitor connection state
        fbDb.ref('.info/connected').on('value', snap => {
          setConnectionStatus(snap.val() ? 'connected' : 'disconnected');
        });

      } catch (err) {
        console.error('Auth error:', err);
        setConnectionStatus('disconnected');
        showToast('Authentication failed. Please refresh.');
      }
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 6: Room Management
    // ═══════════════════════════════════════════════════════════════════

    async function createRoom() {
      if (!myUid) { showToast('Not connected yet. Please wait.'); return; }

      // Generate unique room code
      let code;
      for (let attempt = 0; attempt < 10; attempt++) {
        code = generateRoomCode();
        const existing = await fbDb.ref('games/' + code + '/meta').once('value');
        if (!existing.exists()) break;
        if (attempt === 9) { showToast('Failed to create room. Try again.'); return; }
      }

      currentRoom = code;
      isHost = true;

      await fbDb.ref('games/' + code + '/meta').set({
        roomCode: code,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        hostUid: myUid,
        status: 'lobby',
        includeTraitor: true,
      });

      promptForName('create');
    }

    async function joinRoom() {
      if (!myUid) { showToast('Not connected yet. Please wait.'); return; }

      const code = $('join-code').value.trim().toUpperCase();
      if (code.length !== 6) { showToast('Enter a 6-character room code.'); return; }

      const snap = await fbDb.ref('games/' + code + '/meta').once('value');
      if (!snap.exists()) { showToast('Room not found.'); return; }

      const meta = snap.val();
      if (meta.status !== 'lobby') { showToast('Game already in progress.'); return; }

      // Check player count
      const playersSnap = await fbDb.ref('games/' + code + '/players').once('value');
      const playerCount = playersSnap.exists() ? Object.keys(playersSnap.val()).length : 0;
      if (playerCount >= 7) { showToast('Room is full (7/7 players).'); return; }

      currentRoom = code;
      isHost = false;

      promptForName('join');
    }

    function promptForName(action) {
      $('player-name').value = myName || '';
      showScreen('name-screen');
      $('player-name').focus();

      // Store the action context
      $('btn-confirm-name').dataset.action = action;
    }

    async function confirmName() {
      const name = $('player-name').value.trim();
      if (!name) { showToast('Please enter a name.'); return; }
      if (name.length > 20) { showToast('Name too long (max 20 characters).'); return; }

      myName = name;
      localStorage.setItem('shadows-player-name', name);

      showScreen('lobby-screen');
      enterLobby();
    }

    async function enterLobby() {
      $('lobby-code').textContent = currentRoom;

      // Show/hide host controls
      $('host-settings').style.display = isHost ? '' : 'none';
      $('btn-start').style.display = isHost ? '' : 'none';

      // Build knight selection grid
      renderKnightGrid();

      // Listen for room updates
      listenToRoom();
    }

    function renderKnightGrid() {
      const grid = $('knight-grid');
      grid.innerHTML = '';

      for (const [id, knight] of Object.entries(KNIGHTS)) {
        const card = document.createElement('div');
        card.className = 'knight-card';
        card.dataset.knightId = id;
        card.innerHTML = `
          <img src="${knight.icon}" alt="${knight.name}">
          <div class="knight-name">${knight.name}</div>
          <div class="knight-title">${knight.title}</div>
          <div class="knight-taken-by"></div>
        `;
        card.addEventListener('click', () => selectKnight(id));
        grid.appendChild(card);
      }
    }

    async function selectKnight(knightId) {
      if (!currentRoom || !myUid) return;

      // Check if already taken
      const playersSnap = await fbDb.ref('games/' + currentRoom + '/players').once('value');
      const players = playersSnap.val() || {};

      for (const [kid, data] of Object.entries(players)) {
        if (kid === knightId && data.uid !== myUid) {
          showToast(`${KNIGHTS[knightId].name} is already taken.`);
          return;
        }
      }

      // Remove old selection if switching knights
      if (myKnight && myKnight !== knightId) {
        await fbDb.ref('games/' + currentRoom + '/players/' + myKnight).remove();
      }

      myKnight = knightId;

      await fbDb.ref('games/' + currentRoom + '/players/' + knightId).set({
        uid: myUid,
        displayName: myName,
        knightId: knightId,
        life: 4,
        location: 'roundTable',
        alive: true,
        hasAccused: false,
        relics: { excalibur: false, holyGrail: false, lancelotArmor: false },
        isRevealed: false,
      });
    }

    function listenToRoom() {
      if (gameListener) gameListener();
      if (playersListener) playersListener();

      // Listen to meta
      const metaRef = fbDb.ref('games/' + currentRoom + '/meta');
      gameListener = metaRef.on('value', snap => {
        if (!snap.exists()) {
          showToast('Room was closed.');
          leaveRoom();
          return;
        }
        roomData = snap.val();

        // Update traitor toggle
        const toggle = $('toggle-traitor');
        if (roomData.includeTraitor) {
          toggle.classList.add('on');
        } else {
          toggle.classList.remove('on');
        }

        // If game started, switch to game screen
        if (roomData.status === 'playing') {
          showScreen('game-screen');
        }
      });

      // Listen to players
      const playersRef = fbDb.ref('games/' + currentRoom + '/players');
      playersListener = playersRef.on('value', snap => {
        const players = snap.val() || {};
        updateLobbyUI(players);
      });
    }

    function updateLobbyUI(players) {
      const playerEntries = Object.entries(players);
      const count = playerEntries.length;

      // Update player count
      $('player-count').textContent = count;

      // Update start button
      const startBtn = $('btn-start');
      if (isHost) {
        startBtn.disabled = count < 3;
        startBtn.textContent = count < 3
          ? `Start Game (need ${3 - count} more player${3 - count > 1 ? 's' : ''})`
          : `Start Game (${count} players)`;
      }

      // Update knight grid
      document.querySelectorAll('.knight-card').forEach(card => {
        const kid = card.dataset.knightId;
        const takenBy = playerEntries.find(([k]) => k === kid);
        const takenLabel = card.querySelector('.knight-taken-by');

        card.classList.remove('selected', 'taken');

        if (takenBy) {
          const [, data] = takenBy;
          if (data.uid === myUid) {
            card.classList.add('selected');
            takenLabel.textContent = 'You';
          } else {
            card.classList.add('taken');
            takenLabel.textContent = data.displayName;
          }
        } else {
          takenLabel.textContent = '';
        }
      });

      // Update player list
      const listEl = $('player-list');
      listEl.innerHTML = '';
      for (const [knightId, data] of playerEntries) {
        const knight = KNIGHTS[knightId];
        if (!knight) continue;
        const row = document.createElement('div');
        row.className = 'player-row';
        row.innerHTML = `
          <img src="${knight.icon}" alt="${knight.name}">
          <span class="player-name">${data.displayName}</span>
          <span class="knight-name" style="color:${knight.color};font-size:0.875rem;">${knight.name}</span>
          ${data.uid === roomData?.hostUid ? '<span class="player-badge">Host</span>' : ''}
        `;
        listEl.appendChild(row);
      }
    }

    async function leaveRoom() {
      // Remove our player entry
      if (currentRoom && myKnight && myUid) {
        try {
          await fbDb.ref('games/' + currentRoom + '/players/' + myKnight).remove();
        } catch (e) { /* ignore */ }
      }

      // Detach listeners
      if (gameListener) {
        fbDb.ref('games/' + currentRoom + '/meta').off('value', gameListener);
        gameListener = null;
      }
      if (playersListener) {
        fbDb.ref('games/' + currentRoom + '/players').off('value', playersListener);
        playersListener = null;
      }

      // If host and no other players, delete the room
      if (isHost && currentRoom) {
        try {
          const playersSnap = await fbDb.ref('games/' + currentRoom + '/players').once('value');
          if (!playersSnap.exists() || Object.keys(playersSnap.val()).length === 0) {
            await fbDb.ref('games/' + currentRoom).remove();
          }
        } catch (e) { /* ignore */ }
      }

      currentRoom = null;
      myKnight = null;
      isHost = false;
      roomData = null;

      showScreen('home-screen');
    }

    async function startGame() {
      if (!isHost || !currentRoom) return;

      const playersSnap = await fbDb.ref('games/' + currentRoom + '/players').once('value');
      const players = playersSnap.val() || {};
      const count = Object.keys(players).length;

      if (count < 3) { showToast('Need at least 3 players.'); return; }
      if (count > 7) { showToast('Maximum 7 players.'); return; }

      // Transition to playing state
      await fbDb.ref('games/' + currentRoom + '/meta/status').set('playing');
      showToast('Game started!');
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 7: Event Handlers
    // ═══════════════════════════════════════════════════════════════════

    $('btn-create').addEventListener('click', createRoom);
    $('btn-join').addEventListener('click', joinRoom);

    // Allow Enter key on join code input
    $('join-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinRoom();
    });
    // Force uppercase on input
    $('join-code').addEventListener('input', e => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    $('btn-confirm-name').addEventListener('click', confirmName);
    $('player-name').addEventListener('keydown', e => {
      if (e.key === 'Enter') confirmName();
    });
    $('btn-back-home').addEventListener('click', () => {
      currentRoom = null;
      isHost = false;
      showScreen('home-screen');
    });

    $('btn-leave').addEventListener('click', leaveRoom);
    $('btn-start').addEventListener('click', startGame);

    // Traitor toggle
    $('toggle-traitor').addEventListener('click', () => {
      if (!isHost || !currentRoom) return;
      const toggle = $('toggle-traitor');
      const newVal = !toggle.classList.contains('on');
      fbDb.ref('games/' + currentRoom + '/meta/includeTraitor').set(newVal);
    });

    // Copy room code on tap
    $('lobby-code').addEventListener('click', () => {
      const code = $('lobby-code').textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(() => showToast('Code copied!'));
      }
    });

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 8: Service Worker Registration
    // ═══════════════════════════════════════════════════════════════════

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(reg => console.log('SW registered:', reg.scope))
        .catch(err => console.error('SW registration failed:', err));
    }

    // ═══════════════════════════════════════════════════════════════════
    //  SECTION 9: Initialize
    // ═══════════════════════════════════════════════════════════════════

    initAuth();

  </script>
</body>
</html>
