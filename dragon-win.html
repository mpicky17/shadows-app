<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dragon's Quest — Won</title>
<!--
  STANDALONE comic-book animation (BLACK & WHITE): a knight leaps onto the dragon's
  back and plunges his sword in (Dragon's Quest WON).
  Pure CSS + inline SVG, no dependencies. Auto-plays on load; "Replay" restarts it.

  To embed in the game: lift the .panel markup + this <style> into an overlay, show on
  Dragon WIN, call panel.classList.add('play'); remove when the questResult overlay closes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; -webkit-user-select: none; user-select: none;
  }
  .panel {
    position: relative;
    width: min(92vw, 420px); height: min(115vw, 520px, 90vh);
    border: 6px solid #0c0c0c; border-radius: 4px; overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,0.6), 0 18px 40px rgba(0,0,0,0.85);
    transform: rotate(-0.6deg); background: #141414;
  }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; }
  .panel.play .scene { animation: quake 0.45s 2.25s ease-in-out 2; }
  @keyframes quake { 0%,100% { transform: translate(0,0);} 25% { transform: translate(-5px,3px);} 50% { transform: translate(5px,-2px);} 75% { transform: translate(-3px,-3px);} }

  .bg { background: radial-gradient(120% 100% at 50% 40%, #444 0%, #1e1e1e 52%, #060606 100%); }

  /* radial speed lines burst at the impact point (on the dragon's back) */
  .rays-wrap { display:flex; align-items:center; justify-content:center; opacity:0; z-index:6; left:-12%; top:-12%; }
  .panel.play .rays-wrap { animation: raysIn 1.8s 2.2s ease-out both; }
  @keyframes raysIn { 0% { opacity:0; transform: scale(0.2);} 35% { opacity:0.95; transform: scale(1.2);} 100% { opacity:0; transform: scale(1.6);} }
  .rays { width: 150%; height: 150%; border-radius:50%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.55) 3deg, rgba(255,255,255,0) 7deg, rgba(255,255,255,0) 12deg);
    -webkit-mask-image: radial-gradient(circle, #000 10%, rgba(0,0,0,.5) 34%, transparent 64%);
    mask-image: radial-gradient(circle, #000 10%, rgba(0,0,0,.5) 34%, transparent 64%); }

  .dragon { z-index: 3; }
  .panel.play .dragon { animation: dragonReact 3.8s ease-out both; }
  @keyframes dragonReact {
    0%,55% { transform: translateY(0) rotate(0deg); }
    62% { transform: translateY(6px) rotate(-1.5deg); }   /* jolt from the plunge */
    70% { transform: translateY(0) rotate(0.6deg); }
    80% { transform: translateY(2px) rotate(0deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* knight: leaps in from upper-right, lands, then plunges sword down */
  .knight { position: absolute; left: 40%; top: 16%; width: 34%; height: 47%; z-index: 5; transform-origin: 52% 88%; }
  .panel.play .knight { animation: knightLeap 3.8s cubic-bezier(.3,.5,.3,1) both; }
  @keyframes knightLeap {
    0%   { transform: translate(215px,-320px) rotate(-14deg); }
    42%  { transform: translate(0,0) rotate(-16deg); }       /* land on the back, sword up */
    50%  { transform: translate(0,-7px) rotate(-24deg); }    /* rear back (anticipation) */
    60%  { transform: translate(0,5px) rotate(9deg); }       /* PLUNGE down */
    68%  { transform: translate(0,0) rotate(2deg); }
    100% { transform: translate(0,0) rotate(2deg); }
  }

  .flash { z-index: 7; background:#fff; opacity:0; }
  .panel.play .flash { animation: flash 3.8s ease-out both; }
  @keyframes flash { 0%,57% { opacity:0;} 61% { opacity:0.9;} 67% { opacity:0;} 100% { opacity:0;} }

  .halftone { z-index: 8; background-image: radial-gradient(circle, rgba(0,0,0,.42) 1px, transparent 1.6px); background-size: 6px 6px; mix-blend-mode: multiply; opacity: 0.2; }

  .replay { font-family: inherit; font-size: 1rem; cursor: pointer; background: transparent; color: #fff;
    border: 2px solid #fff; border-radius: 8px; padding: 0.5rem 1.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .replay:hover, .replay:focus { background: #fff; color: #000; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="scene">
      <div class="layer bg"></div>

      <!-- DRAGON (side profile, facing left; back arched across the panel) -->
      <svg class="layer dragon" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice" fill="none">
        <defs>
          <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7f7f7f"/><stop offset="0.5" stop-color="#4d4d4d"/><stop offset="1" stop-color="#1f1f1f"/>
          </linearGradient>
          <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#141414"/>
          </linearGradient>
        </defs>

        <!-- wing membrane behind -->
        <path d="M232 300 L300 70 L316 150 L352 96 L350 180 L392 150 L356 246 L300 250 Z" fill="url(#wing)" stroke="#0c0c0c" stroke-width="3.5" stroke-linejoin="round"/>
        <g stroke="#0c0c0c" stroke-width="2" opacity="0.7"><path d="M300 250 L304 80"/><path d="M300 250 L344 104"/><path d="M300 250 L350 176"/></g>

        <!-- tail -->
        <path d="M338 348 C396 336 412 270 384 224 C372 250 360 262 340 300 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
        <path d="M384 224 L368 196 L398 210 L380 232 Z" fill="#2a2a2a" stroke="#0c0c0c" stroke-width="2.5"/>

        <!-- body -->
        <path d="M70 392
                 C 58 338 104 300 168 296
                 C 226 292 282 292 322 302
                 C 356 310 374 336 360 378
                 C 350 404 320 414 300 408
                 L 196 408
                 C 156 412 124 404 112 388 Z"
              fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>

        <!-- neck + head (lowered, roaring down-left) -->
        <path d="M112 360 C 80 360 52 374 40 404 C 34 420 36 436 52 440 L 96 430
                 C 86 414 92 392 120 380 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
        <!-- lower jaw -->
        <path d="M52 440 C 70 452 104 452 128 442 L 120 430 L 92 434 L 68 430 Z" fill="#3a3a3a" stroke="#0c0c0c" stroke-width="3.5" stroke-linejoin="round"/>
        <!-- head horns -->
        <path d="M120 364 C 110 332 120 306 150 300 C 134 320 132 344 150 360 Z" fill="#6a6a6a" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>
        <path d="M104 368 C 90 340 96 314 120 304 C 104 326 104 348 124 366 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>
        <!-- eye -->
        <ellipse cx="86" cy="396" rx="9" ry="6.5" fill="#f2f2f2" stroke="#0c0c0c" stroke-width="2.5"/>
        <path d="M86 390 L89 396 L86 402 L83 396 Z" fill="#0c0c0c"/>
        <!-- teeth -->
        <g fill="#efefef" stroke="#0c0c0c" stroke-width="1.5">
          <path d="M60 432 L64 444 L70 432 Z"/><path d="M80 434 L84 446 L90 434 Z"/><path d="M102 432 L106 444 L112 432 Z"/>
        </g>

        <!-- spines along the back ridge -->
        <g fill="#1c1c1c" stroke="#0c0c0c" stroke-width="2">
          <path d="M150 298 L160 268 L172 296 Z"/><path d="M192 293 L202 261 L214 292 Z"/>
          <path d="M236 292 L246 260 L258 291 Z"/><path d="M280 294 L290 264 L302 296 Z"/>
          <path d="M320 302 L330 274 L342 304 Z"/>
        </g>

        <!-- foreleg + hind leg with claws -->
        <path d="M150 404 C 146 432 148 456 152 470 L 170 470 C 168 452 168 428 172 406 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
        <g stroke="#0c0c0c" stroke-width="2.5" fill="#dcdcdc"><path d="M150 470 l-6 10 M158 470 l0 12 M166 470 l6 10"/></g>
        <path d="M300 408 C 300 436 304 458 310 472 L 330 472 C 326 452 324 430 326 410 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
        <g stroke="#0c0c0c" stroke-width="2.5" fill="#dcdcdc"><path d="M308 472 l-6 10 M318 472 l0 12 M326 472 l6 10"/></g>

        <!-- scale texture on the body -->
        <g stroke="#2b2b2b" stroke-width="2" fill="none" opacity="0.8">
          <path d="M150 330 q12 9 24 0 M176 334 q12 9 24 0 M202 332 q12 9 24 0 M228 332 q12 9 24 0 M254 332 q12 9 24 0 M280 336 q12 9 24 0"/>
          <path d="M160 354 q12 9 24 0 M186 358 q12 9 24 0 M212 356 q12 9 24 0 M238 356 q12 9 24 0 M264 358 q12 9 24 0"/>
        </g>
        <!-- belly highlight -->
        <path d="M150 392 C 200 404 280 402 320 388" stroke="#9a9a9a" stroke-width="3" fill="none" opacity="0.5"/>
      </svg>

      <div class="layer rays-wrap"><div class="rays"></div></div>

      <!-- KNIGHT (faces left; sword angled down toward the dragon's back) -->
      <div class="knight">
        <svg viewBox="0 0 200 260" width="100%" height="100%" fill="none">
          <defs>
            <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ededed"/><stop offset="0.5" stop-color="#9a9a9a"/><stop offset="1" stop-color="#4f4f4f"/>
            </linearGradient>
            <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6f6f6f"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#5e5e5e"/>
            </linearGradient>
          </defs>

          <!-- cape flowing back-right -->
          <path d="M120 70 C 170 80 188 140 178 196 C 160 168 150 170 132 150 C 140 120 128 92 116 84 Z" fill="#202020" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>

          <!-- rear leg extended back-right -->
          <path d="M118 150 C 140 168 158 188 168 214 L 150 224 C 138 200 122 184 104 172 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M150 224 l22 6 l-4 12 l-22 -6 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="2.5"/>

          <!-- front leg, knee forward, planted on the back -->
          <path d="M96 138 C 86 162 82 190 92 214 L 112 214 C 106 190 108 164 118 146 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>
          <path d="M88 214 l-20 8 l4 12 l24 -8 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="2.5"/>

          <!-- torso / cuirass, leaning forward-left -->
          <path d="M78 66 C 68 60 60 66 58 78 L 70 142 C 78 156 110 156 120 142 L 122 80 C 120 66 108 60 98 64 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M70 96 L118 92 M70 112 L120 108" stroke="#2b2b2b" stroke-width="2"/>
          <!-- pauldron -->
          <ellipse cx="74" cy="74" rx="18" ry="13" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3"/>

          <!-- helmet -->
          <path d="M70 40 C 70 22 92 16 104 24 C 114 30 114 46 108 56 L 78 58 C 70 54 70 46 70 40 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3.5" stroke-linejoin="round"/>
          <rect x="74" y="40" width="34" height="5" rx="2" fill="#101010"/>
          <!-- plume -->
          <path d="M104 22 C 124 6 140 8 150 18 C 132 18 120 28 110 40 Z" fill="#2a2a2a" stroke="#0c0c0c" stroke-width="2.5"/>

          <!-- both arms drive the sword down-left -->
          <path d="M70 92 C 56 104 46 124 40 146 L 56 154 C 62 132 72 116 86 106 Z" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>
          <!-- gauntlets / hands gripping hilt -->
          <circle cx="48" cy="150" r="11" fill="url(#steel)" stroke="#0c0c0c" stroke-width="3"/>

          <!-- SWORD: hilt at the hands, blade plunging down-left -->
          <rect x="40" y="132" width="34" height="9" rx="3" transform="rotate(-32 57 136)" fill="url(#steel)" stroke="#0c0c0c" stroke-width="2.5"/>
          <rect x="50" y="140" width="9" height="16" rx="3" transform="rotate(-32 54 148)" fill="#3a3a3a" stroke="#0c0c0c" stroke-width="2"/>
          <path d="M44 156 L60 150 L34 232 L24 236 Z" fill="url(#blade)" stroke="#0c0c0c" stroke-width="2.3" stroke-linejoin="round"/>
          <line x1="50" y1="158" x2="30" y2="226" stroke="#fff" stroke-width="1.1" opacity="0.7"/>
        </svg>
      </div>

      <div class="layer flash"></div>
      <div class="layer halftone"></div>
    </div>
  </div>

  <button class="replay" id="replay">Replay</button>

<script>
  const panel = document.getElementById('panel');
  function play() { panel.classList.remove('play'); void panel.offsetWidth; panel.classList.add('play'); }
  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('load', play);
</script>
</body>
</html>
