<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Excalibur — Quest Won</title>
<!--
  STANDALONE comic-book animation (BLACK & WHITE): Excalibur pulled from the stone (Quest WON).
  The sword rests point-down with its tip embedded in the TOP of the stone (sitting above it),
  and is pulled straight up. Pure CSS + inline SVG, no dependencies.
  Auto-plays on load; "Replay" restarts it.

  Layering: stone-back (behind) -> sword -> stone-front (in front, hides the embedded tip).
  To embed in the game: lift the .panel markup + this <style> into an overlay, show on
  Excalibur WIN, call panel.classList.add('play'); remove when the questResult overlay closes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; -webkit-user-select: none; user-select: none;
  }
  .panel {
    position: relative;
    width: min(92vw, 420px); height: min(115vw, 520px);
    border: 6px solid #0c0c0c; border-radius: 4px; overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,0.6), 0 18px 40px rgba(0,0,0,0.8);
    transform: rotate(-0.6deg); background: #161616;
  }
  .layer { position: absolute; inset: 0; }

  .bg { background: radial-gradient(125% 95% at 50% 70%, #454545 0%, #1d1d1d 55%, #060606 100%); }
  .panel.play .bg { animation: bgZoom 3.6s ease-out both; }
  @keyframes bgZoom { 0% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* radial white speed-line burst */
  .rays-wrap { display: flex; align-items: center; justify-content: center; opacity: 0; z-index: 1; }
  .panel.play .rays-wrap { animation: raysIn 2.3s 1.45s ease-out both; }
  @keyframes raysIn { 0% { opacity: 0; transform: scale(0.25);} 35% { opacity: 0.95; transform: scale(1.25);} 100% { opacity: 0.5; transform: scale(1);} }
  .rays {
    width: 165%; height: 165%; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,255,255,0) 0deg, rgba(255,255,255,0.6) 3deg, rgba(255,255,255,0) 6deg, rgba(255,255,255,0) 11deg);
    -webkit-mask-image: radial-gradient(circle, #000 14%, rgba(0,0,0,0.6) 38%, transparent 68%);
    mask-image: radial-gradient(circle, #000 14%, rgba(0,0,0,0.6) 38%, transparent 68%);
  }
  .panel.play .rays { animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .glow { z-index: 2; background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.28) 20%, transparent 50%); opacity: 0; }
  .panel.play .glow { animation: glowBuild 3.6s ease-in-out both; }
  @keyframes glowBuild { 0% { opacity: 0;} 35% { opacity: 0.2;} 52% { opacity: 1;} 62% { opacity: 0.6;} 100% { opacity: 0.72;} }

  .stone-back { z-index: 3; }

  /* sword drawn point-DOWN; bottom-anchored so its tip sits in the stone's top */
  .sword {
    position: absolute; left: 50%; bottom: 33%;
    width: 92px; height: 246px; z-index: 4;
    transform: translateX(-50%) translateY(110px); /* starts deep in the stone */
  }
  .panel.play .sword { animation: heroPull 3.0s cubic-bezier(.18,.7,.2,1) both; }
  @keyframes heroPull {
    /* starts ~1/5 panel-height lower (deeper in the stone), then pulled all the way up */
    0%   { transform: translateX(-50%) translateY(110px); }
    9%   { transform: translateX(-50%) translateY(106px); }
    16%  { transform: translateX(-50%) translateY(114px); }
    24%  { transform: translateX(-50%) translateY(106px); }
    32%  { transform: translateX(-50%) translateY(113px); }
    40%  { transform: translateX(-50%) translateY(110px); }
    58%  { transform: translateX(-50%) translateY(-118px); }  /* yank up + overshoot */
    66%  { transform: translateX(-50%) translateY(-106px); }
    100% { transform: translateX(-50%) translateY(-106px); }
  }
  .sword-art { width: 100%; height: 100%; }
  .panel.play .sword-art { animation: bob 2.6s 2.15s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-7px);} }

  .stone-front { z-index: 5; }

  .dust {
    z-index: 6; bottom: 36%; left: 50%; width: 160px; height: 54px;
    transform: translateX(-50%) scale(0.4); border-radius: 50%;
    background: radial-gradient(circle, rgba(225,225,225,0.5), transparent 70%); opacity: 0;
  }
  .panel.play .dust { animation: dust 1.1s 1.5s ease-out both; }
  @keyframes dust { 0% { opacity: 0; transform: translateX(-50%) scale(0.4);} 25% { opacity: 0.8;} 100% { opacity: 0; transform: translateX(-50%) scale(1.7);} }

  .halftone { z-index: 7; background-image: radial-gradient(circle, rgba(0,0,0,0.4) 1px, transparent 1.6px); background-size: 6px 6px; mix-blend-mode: multiply; opacity: 0.2; }
  .panel.play .halftone { animation: htPulse 3.6s ease-in-out both; }
  @keyframes htPulse { 0%,100% { opacity: 0.17; } 55% { opacity: 0.3; } }

  .flash { z-index: 8; background: #fff; opacity: 0; }
  .panel.play .flash { animation: flash 3.4s ease-out both; }
  @keyframes flash { 0%, 50% { opacity: 0;} 54% { opacity: 0.9;} 60% { opacity: 0;} 100% { opacity: 0;} }

  .sparkles { z-index: 6; pointer-events: none; }
  .spark { position: absolute; width: 8px; height: 8px; background: #fff;
    clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
    opacity: 0; animation: twinkle 1.6s ease-out both; }
  @keyframes twinkle { 0% { opacity: 0; transform: scale(0.2);} 60% { opacity: 1; transform: scale(1);} 100% { opacity: 0; transform: scale(0.4) translateY(-14px);} }

  .replay { font-family: inherit; font-size: 1rem; cursor: pointer; background: transparent; color: #fff;
    border: 2px solid #fff; border-radius: 8px; padding: 0.5rem 1.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .replay:hover, .replay:focus { background: #fff; color: #000; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="layer bg"></div>
    <div class="layer rays-wrap"><div class="rays"></div></div>
    <div class="layer glow"></div>

    <!-- STONE (back silhouette, behind the sword) -->
    <svg class="layer stone-back" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice" fill="none">
      <path d="M70 520 L84 348 Q92 312 150 304 L270 304 Q330 312 338 348 L352 520 Z" fill="#2a2a2a"/>
    </svg>

    <!-- SWORD (point-down) -->
    <div class="layer sword">
      <div class="sword-art">
        <svg viewBox="0 0 80 246" width="100%" height="100%" fill="none">
          <defs>
            <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#6f6f6f"/><stop offset="0.16" stop-color="#bcbcbc"/>
              <stop offset="0.4" stop-color="#ffffff"/><stop offset="0.5" stop-color="#dcdcdc"/>
              <stop offset="0.6" stop-color="#ffffff"/><stop offset="0.84" stop-color="#b3b3b3"/>
              <stop offset="1" stop-color="#5e5e5e"/>
            </linearGradient>
            <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0f0f0"/><stop offset="0.5" stop-color="#9a9a9a"/><stop offset="1" stop-color="#525252"/>
            </linearGradient>
            <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#535353"/><stop offset="1" stop-color="#1d1d1d"/>
            </linearGradient>
          </defs>

          <!-- pommel -->
          <circle cx="40" cy="16" r="12" fill="url(#metal)" stroke="#0c0c0c" stroke-width="2.5"/>
          <circle cx="40" cy="16" r="5" fill="#efefef" stroke="#0c0c0c" stroke-width="1"/>
          <circle cx="36.5" cy="12.5" r="2" fill="#fff"/>
          <!-- grip with cross-wrap -->
          <rect x="32" y="27" width="16" height="48" rx="3" fill="url(#grip)" stroke="#0c0c0c" stroke-width="2.5"/>
          <g stroke="#7a7a7a" stroke-width="2">
            <line x1="33" y1="31" x2="47" y2="37"/><line x1="33" y1="39" x2="47" y2="45"/>
            <line x1="33" y1="47" x2="47" y2="53"/><line x1="33" y1="55" x2="47" y2="61"/>
            <line x1="33" y1="63" x2="47" y2="69"/>
          </g>
          <g stroke="#2c2c2c" stroke-width="1.4" opacity="0.8">
            <line x1="33" y1="37" x2="47" y2="31"/><line x1="33" y1="45" x2="47" y2="39"/>
            <line x1="33" y1="53" x2="47" y2="47"/><line x1="33" y1="61" x2="47" y2="55"/>
            <line x1="33" y1="69" x2="47" y2="63"/>
          </g>
          <!-- crossguard (curved quillons) -->
          <path d="M12 84 Q40 73 68 84 Q64 92 60 90 Q40 82 20 90 Q16 92 12 84 Z" fill="url(#metal)" stroke="#0c0c0c" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="13" cy="85" r="3.5" fill="url(#metal)" stroke="#0c0c0c" stroke-width="1.5"/>
          <circle cx="67" cy="85" r="3.5" fill="url(#metal)" stroke="#0c0c0c" stroke-width="1.5"/>
          <!-- blade (tapered, point down), with fuller -->
          <path d="M30 92 L50 92 L47 168 L40 238 L33 168 Z" fill="url(#blade)" stroke="#0c0c0c" stroke-width="2.3" stroke-linejoin="round"/>
          <path d="M40 96 L43.5 168 L40 214 L36.5 168 Z" fill="#6f6f6f" opacity="0.55"/>
          <line x1="40" y1="98" x2="40" y2="206" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
        </svg>
      </div>
    </div>

    <!-- STONE (front face, in front of the sword — hides the embedded tip) -->
    <svg class="layer stone-front" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice" fill="none">
      <defs>
        <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a7a7a"/><stop offset="0.5" stop-color="#565656"/><stop offset="1" stop-color="#2f2f2f"/>
        </linearGradient>
      </defs>
      <!-- body -->
      <path d="M60 520 L78 360 Q86 326 140 320 L210 322 L280 320 Q336 326 344 360 L362 520 Z"
            fill="url(#rock)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
      <!-- lit facets (upper-left) -->
      <path d="M86 360 Q92 330 140 322 L196 322 L150 360 Z" fill="#8a8a8a" opacity="0.65"/>
      <path d="M150 360 L196 322 L210 360 Z" fill="#737373" opacity="0.6"/>
      <!-- shadowed facets (lower-right) -->
      <path d="M250 360 L280 322 L336 330 L330 400 Z" fill="#3a3a3a" opacity="0.7"/>
      <path d="M210 360 L250 360 L264 460 L210 470 Z" fill="#444" opacity="0.5"/>
      <!-- slot where the blade enters + radiating stress cracks -->
      <rect x="196" y="316" width="28" height="22" rx="3" fill="#101010" stroke="#0c0c0c" stroke-width="2"/>
      <g stroke="#1c1c1c" stroke-width="2.5" stroke-linecap="round" fill="none">
        <path d="M210 338 L188 392 L176 360"/>
        <path d="M214 338 L246 388 L262 366"/>
        <path d="M204 338 L196 430"/>
        <path d="M218 338 L232 470"/>
      </g>
      <!-- texture speckles / moss -->
      <g fill="#1f1f1f" opacity="0.55">
        <ellipse cx="110" cy="470" rx="16" ry="7"/><ellipse cx="300" cy="486" rx="20" ry="8"/>
        <circle cx="150" cy="430" r="4"/><circle cx="262" cy="412" r="3"/><circle cx="320" cy="450" r="5"/>
      </g>
      <g fill="#9a9a9a" opacity="0.5"><circle cx="120" cy="392" r="3"/><circle cx="178" cy="448" r="2.5"/><circle cx="300" cy="404" r="2.5"/></g>
    </svg>

    <div class="layer dust"></div>
    <div class="layer sparkles" id="sparkles"></div>
    <div class="layer halftone"></div>
    <div class="layer flash"></div>
  </div>

  <button class="replay" id="replay">Replay</button>

<script>
  const panel = document.getElementById('panel');
  const sparkles = document.getElementById('sparkles');
  function buildSparkles() {
    sparkles.innerHTML = '';
    for (let i = 0; i < 11; i++) {
      const s = document.createElement('div');
      s.className = 'spark';
      s.style.left = (50 + (Math.random() * 44 - 22)) + '%';
      s.style.top = (12 + Math.random() * 40) + '%';
      const sz = 6 + Math.random() * 10;
      s.style.width = s.style.height = sz + 'px';
      s.style.animationDelay = (1.95 + Math.random() * 0.7).toFixed(2) + 's';
      sparkles.appendChild(s);
    }
  }
  function play() {
    panel.classList.remove('play');
    void panel.offsetWidth;
    buildSparkles();
    panel.classList.add('play');
  }
  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('load', play);
</script>
</body>
</html>
