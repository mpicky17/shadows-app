<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dragon's Quest — Lost</title>
<!--
  STANDALONE comic-book animation (BLACK & WHITE): the Dragon rears and unleashes a
  giant fireball that engulfs the screen (Dragon's Quest LOST).
  Pure CSS + inline SVG, no dependencies. Auto-plays on load; "Replay" restarts it.

  To embed in the game: lift the .panel markup + this <style> into an overlay, show on
  Dragon LOSS, call panel.classList.add('play'); remove when the questResult overlay closes.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.25rem; -webkit-user-select: none; user-select: none;
  }
  .panel {
    position: relative;
    width: min(92vw, 420px); height: min(115vw, 520px, 90vh);
    border: 6px solid #0c0c0c; border-radius: 4px; overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,0.6), 0 18px 40px rgba(0,0,0,0.85);
    transform: rotate(-0.6deg); background: #0c0c0c;
  }
  .layer { position: absolute; inset: 0; }
  .scene { position: absolute; inset: 0; } /* shaken during the blast */
  .panel.play .scene { animation: quake 0.5s 1.65s ease-in-out 3; }
  @keyframes quake {
    0%,100% { transform: translate(0,0); } 20% { transform: translate(-4px,3px);} 40% { transform: translate(4px,-3px);}
    60% { transform: translate(-3px,-2px);} 80% { transform: translate(3px,2px);}
  }

  .bg { background: radial-gradient(120% 100% at 62% 52%, #3a3a3a 0%, #1c1c1c 50%, #050505 100%); }

  /* radial speed lines from the blast point */
  .rays-wrap { display:flex; align-items:center; justify-content:center; opacity:0; z-index:5;
    left: 18%; top: 6%; } /* center roughly on the maw */
  .panel.play .rays-wrap { animation: raysIn 2.4s 1.6s ease-out both; }
  @keyframes raysIn { 0% { opacity:0; transform: scale(0.2);} 30% { opacity:0.9; transform: scale(1.3);} 100% { opacity:0.4; transform: scale(1.7);} }
  .rays { width: 200%; height: 200%; border-radius:50%;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg, rgba(255,255,255,0.5) 3deg, rgba(255,255,255,0) 7deg, rgba(255,255,255,0) 12deg);
    -webkit-mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 34%, transparent 64%);
    mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 34%, transparent 64%); }
  .panel.play .rays { animation: spin 18s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg);} }

  .dragon { z-index: 3; }
  .panel.play .dragon { animation: dragonRear 4.2s ease-in-out both; }
  @keyframes dragonRear {
    0% { transform: translateY(14px) scale(0.98); }
    18% { transform: translateY(-4px) scale(1.0); }   /* rear up */
    40% { transform: translateY(2px) scale(1.02); }   /* lunge forward to breathe */
    60% { transform: translateY(0) scale(1.0); }
    100% { transform: translateY(0) scale(1.0); }
  }

  /* throat / maw glow that builds before the blast */
  .maw { z-index: 4; background: radial-gradient(circle at 31% 30%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.3) 8%, transparent 22%); opacity: 0; }
  .panel.play .maw { animation: mawGlow 2.0s 0.5s ease-in both; }
  @keyframes mawGlow { 0% { opacity: 0;} 70% { opacity: 0.5;} 100% { opacity: 1;} }

  /* fireball erupts from the maw and engulfs the panel */
  .fire { z-index: 6; transform-origin: 31% 30%; transform: scale(0); opacity: 0; }
  .panel.play .fire { animation: blast 2.6s 1.62s cubic-bezier(.3,.1,.3,1) both; }
  @keyframes blast {
    0% { transform: scale(0.05); opacity: 0; }
    8% { opacity: 1; }
    30% { transform: scale(0.9); }
    70% { transform: scale(2.6); }
    100% { transform: scale(3.4); opacity: 1; }
  }

  .flash { z-index: 7; background: #fff; opacity: 0; }
  .panel.play .flash { animation: flash 4.2s ease-out both; }
  @keyframes flash { 0%, 62% { opacity: 0;} 72% { opacity: 0.95;} 86% { opacity: 0.8;} 100% { opacity: 0.78; } }

  .halftone { z-index: 8; background-image: radial-gradient(circle, rgba(0,0,0,.42) 1px, transparent 1.6px); background-size: 6px 6px; mix-blend-mode: multiply; opacity: 0.2; }

  .replay { font-family: inherit; font-size: 1rem; cursor: pointer; background: transparent; color: #fff;
    border: 2px solid #fff; border-radius: 8px; padding: 0.5rem 1.5rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .replay:hover, .replay:focus { background: #fff; color: #000; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="scene">
      <div class="layer bg"></div>

      <!-- DRAGON head + neck (facing right, jaws agape) -->
      <svg class="layer dragon" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid slice" fill="none">
        <defs>
          <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a8a8a"/><stop offset="0.5" stop-color="#535353"/><stop offset="1" stop-color="#232323"/>
          </linearGradient>
          <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#161616"/>
          </linearGradient>
        </defs>

        <!-- wing membrane silhouette behind -->
        <path d="M150 250 L40 80 L70 175 L20 150 L80 240 L30 250 L120 300 Z" fill="url(#wing)" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
        <g stroke="#0c0c0c" stroke-width="2" opacity="0.7">
          <path d="M120 300 L48 95"/><path d="M120 300 L66 190"/><path d="M120 300 L78 245"/>
        </g>

        <!-- neck -->
        <path d="M40 520 C70 430 70 360 150 312 C 188 286 196 250 214 232 L256 300 C220 330 196 392 188 452 C182 488 170 510 168 520 Z"
              fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>

        <!-- head: upper jaw + skull -->
        <path d="M196 250 C188 214 196 188 226 182 L262 188 C300 196 332 214 372 244 L330 256 L300 250 L286 262 L262 258 L244 268 L224 260 Z"
              fill="url(#hide)" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>
        <!-- lower jaw (open) -->
        <path d="M232 286 C250 300 288 306 330 300 L356 292 L330 286 L300 292 L276 286 L252 292 Z"
              fill="#3b3b3b" stroke="#0c0c0c" stroke-width="4" stroke-linejoin="round"/>

        <!-- horns -->
        <path d="M226 182 C206 150 170 132 120 132 C162 142 180 168 208 188 Z" fill="url(#hide)" stroke="#0c0c0c" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M244 184 C232 156 206 138 176 132 C206 150 214 172 234 192 Z" fill="#6a6a6a" stroke="#0c0c0c" stroke-width="3" stroke-linejoin="round"/>

        <!-- brow + eye -->
        <path d="M214 214 C224 206 240 206 250 212" stroke="#0c0c0c" stroke-width="3" fill="none"/>
        <ellipse cx="232" cy="224" rx="11" ry="8" fill="#f2f2f2" stroke="#0c0c0c" stroke-width="2.5"/>
        <path d="M232 217 L236 224 L232 231 L228 224 Z" fill="#0c0c0c"/>

        <!-- upper teeth -->
        <g fill="#efefef" stroke="#0c0c0c" stroke-width="1.5">
          <path d="M262 258 L268 274 L274 258 Z"/><path d="M286 262 L292 280 L298 262 Z"/>
          <path d="M312 256 L318 272 L324 256 Z"/><path d="M336 254 L341 268 L346 254 Z"/>
        </g>
        <!-- lower teeth -->
        <g fill="#e6e6e6" stroke="#0c0c0c" stroke-width="1.5">
          <path d="M276 286 L281 274 L287 286 Z"/><path d="M300 290 L305 278 L311 290 Z"/><path d="M326 287 L331 276 L337 287 Z"/>
        </g>

        <!-- nostril -->
        <path d="M352 246 C358 244 362 248 360 252" stroke="#0c0c0c" stroke-width="3" fill="none"/>

        <!-- neck spines -->
        <g fill="#1c1c1c" stroke="#0c0c0c" stroke-width="2">
          <path d="M150 312 L132 286 L168 300 Z"/><path d="M120 360 L98 338 L140 348 Z"/>
          <path d="M86 416 L62 398 L104 404 Z"/><path d="M66 470 L42 456 L84 458 Z"/>
        </g>
        <!-- scale texture on neck/cheek -->
        <g stroke="#2a2a2a" stroke-width="2" fill="none" opacity="0.8">
          <path d="M150 360 q12 10 24 0 M176 366 q12 10 24 0"/>
          <path d="M132 404 q12 10 24 0 M158 410 q12 10 24 0"/>
          <path d="M112 448 q12 10 24 0 M138 454 q12 10 24 0"/>
        </g>
        <!-- jaw underside shadow -->
        <path d="M232 286 C250 300 288 306 330 300 L330 306 C288 312 250 306 232 292 Z" fill="#101010" opacity="0.6"/>
      </svg>

      <div class="layer maw"></div>
      <div class="layer rays-wrap"><div class="rays"></div></div>

      <!-- FIREBALL -->
      <svg class="layer fire" viewBox="0 0 420 520" preserveAspectRatio="xMidYMid meet" fill="none">
        <defs>
          <radialGradient id="core" cx="50%" cy="50%" r="50%">
            <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#fbfbfb"/>
            <stop offset="0.7" stop-color="#cfcfcf"/><stop offset="1" stop-color="#8f8f8f"/>
          </radialGradient>
        </defs>
        <!-- billowing smoke/flame clusters (outer, darker) -->
        <g fill="#9a9a9a" stroke="#0c0c0c" stroke-width="3">
          <circle cx="150" cy="150" r="60"/><circle cx="250" cy="120" r="70"/><circle cx="320" cy="200" r="66"/>
          <circle cx="300" cy="300" r="74"/><circle cx="200" cy="320" r="70"/><circle cx="110" cy="250" r="64"/>
          <circle cx="210" cy="220" r="90"/>
        </g>
        <!-- inner hot billows -->
        <g fill="#dcdcdc">
          <circle cx="180" cy="180" r="48"/><circle cx="250" cy="170" r="54"/><circle cx="270" cy="250" r="52"/>
          <circle cx="190" cy="260" r="50"/><circle cx="215" cy="215" r="64"/>
        </g>
        <!-- white-hot core -->
        <circle cx="212" cy="215" r="74" fill="url(#core)"/>
        <!-- flame tongues licking outward -->
        <g fill="#e9e9e9" stroke="#0c0c0c" stroke-width="2.5">
          <path d="M212 60 L232 130 L192 130 Z"/><path d="M360 215 L290 235 L290 195 Z"/>
          <path d="M212 370 L232 300 L192 300 Z"/><path d="M64 215 L134 235 L134 195 Z"/>
          <path d="M312 110 L300 175 L262 150 Z"/><path d="M120 320 L132 255 L168 282 Z"/>
        </g>
      </svg>

      <div class="layer flash"></div>
      <div class="layer halftone"></div>
    </div>
  </div>

  <button class="replay" id="replay">Replay</button>

<script>
  const panel = document.getElementById('panel');
  function play() { panel.classList.remove('play'); void panel.offsetWidth; panel.classList.add('play'); }
  document.getElementById('replay').addEventListener('click', play);
  window.addEventListener('load', play);
</script>
</body>
</html>
